packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  core-js: true
  prisma: true
  sharp: true
  unrs-resolver: true

# บังคับเวอร์ชันของ dependency ทางอ้อมที่มีช่องโหว่ ให้ขึ้นไปเป็นรุ่นที่แก้แล้ว
# ทั้งหมดเป็นการขยับภายในเมเจอร์เดิม ยกเว้น tar ที่ 6 ไป 7 ซึ่งเหลือแค่ผู้ใช้
# ในขั้นตอนติดตั้ง หลังอัป bcrypt เป็น 6 ที่ตัด node-pre-gyp ออกไปแล้ว
overrides:
  multer: '^2.2.0'
  lodash: '^4.18.1'
  postcss: '^8.5.28'
  sharp: '^0.35.0'
  glob: '^10.5.0'
  picomatch: '^4.0.7'
  tmp: '^0.2.6'
  minimatch: '^9.0.9'
  tar: '^7.5.21'
