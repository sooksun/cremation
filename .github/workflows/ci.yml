name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @cremation/api exec prisma generate

      - name: Lint Web
        run: pnpm --filter @cremation/web run lint

      - name: Test API
        env:
          JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
        run: pnpm --filter @cremation/api run test

      - name: E2E API
        env:
          JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
        run: pnpm --filter @cremation/api run test:e2e

      - name: Build API
        run: pnpm --filter @cremation/api run build

      - name: Build Web
        env:
          NEXT_PUBLIC_API_URL: ''
        run: pnpm --filter @cremation/web run build