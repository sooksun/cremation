services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: cremation-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${WEB_ORIGIN}
      CORS_ORIGINS: ${WEB_ORIGIN}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9971:4000"
    networks:
      - cremation-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: cremation-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "9970:3000"
    depends_on:
      - api
    networks:
      - cremation-net

  # One-time seed for a fresh install. Uses the Dockerfile.api builder stage
  # (full source + ts-node) because prisma/seed.ts imports from ../src/*.
  # Run with: docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: builder
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    working_dir: /repo
    command: ["pnpm", "--filter", "@cremation/api", "run", "db:seed"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["seed"]
    networks:
      - cremation-net

  backup:
    image: mariadb:11
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
    volumes:
      - ./backup:/backup
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup/backup.sh && while true; do /backup/backup.sh; sleep 86400; done"]
    networks:
      - cremation-net

networks:
  cremation-net:
    driver: bridge